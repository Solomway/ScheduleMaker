<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="sidebar">
            <h1>Create Schedule</h1>
            <button onclick="window.location.href='homepage.html'">Home</button>
            <button onclick="window.location.href='employees.html'">Edit Employees</button>
            <button onclick="window.location.href='shifts.html'">Edit Shifts</button>
            <br>
            <hr>
            <p>Current User: <span id="currentUser" style="color: white;"></span></p>
            <button onclick="signOut()" class="btn-logout" style="background-color: #dc3545; color: white;">Sign Out</button>
        </div>
        <hr>
        <div class="main-content">
            <div>
                <h3>
                    Generate Schedule
                </h3>
            
                <input type="date" id="startDate" placeholder="Start Date" size=10000px>
                <input type="number" id="num_days" placeholder="Number Of Days">
                <button onclick="generateSchedule()">Generate Schedule</button>
                <br>
                <div class="schedule-options" style="margin: 15px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; max-width: 350px;">
                    <h4 style="margin-top: 0;">Options</h4>
                    <label style="display: block; margin-bottom: 8px;">
                        <input type="checkbox" id="opt_stat_holidays" checked> Work Stat Holidays
                    </label>
                    <label style="display: block; margin-bottom: 8px;">
                        <input type="checkbox" id="opt_consecutive_off" checked> Attempt Consecutive Days Off
                    </label>
                    <label style="display: block;">
                        <input type="checkbox" id="opt_equalize_hours"> Equalize Total Hours
                    </label>
                </div>
            </div>
            <div id="scheduleOutput"> </div>
            <br>
            <hr>
            
            <div>
                <h3>
                    Employees Table
                </h3>
                <div id="EmpviewOutput"></div>
                <br>
                <hr>
            </div>

            <div>
                <h3>
                    Shifts Table
                </h3>
            <div id="ShiftviewOutput"></div>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
</html>
